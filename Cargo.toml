[workspace]
resolver = "2"

members = [
    "pantsu_server",
    "domain",
    "incoming/pantsu_openapi",
    "incoming/http-api",
    "outgoing/iqdb",
    "outgoing/fs",
    "outgoing/shared/worker",
]

[workspace.dependencies]
pantsu-domain = { path = "domain" }
pantsu-openapi = { path = "incoming/pantsu_openapi" }
pantsu-http-api = { path = "incoming/http-api" }
pantsu-fs = { path = "outgoing/fs" }
pantsu-iqdb = { path = "outgoing/iqdb" }
pantsu-worker = { path = "outgoing/shared/worker" }

async-trait = "0.1.89"
axum = { version = "0.8.7", features = ["multipart"] }
axum-macros = "0.5.0"
axum_typed_multipart = "0.16.4"
blockhash = "1.0.0"
byte-unit = "5.2.0"
bytes = "1.11.0"
chrono = "0.4.42"
figment = { version = "0.10.19", features = ["env", "yaml"] }
futures = "0.3.31"
image = "0.25.9"
lz_fnv = "0.1.2"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "fs"] }
tokio-stream = "0.1.17"
tower-http = { version = "0.6.7", features = ["trace", "request-id"] }
tracing = "0.1.43"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.19.0", features = ["v4"] }
yansi = "1.0.1"
headers = "0.4.1"
axum-extra = "0.12.2"
