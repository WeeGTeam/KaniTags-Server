[workspace]
resolver = "2"

members = [
    "pantsu_server",
    "domain",
    "domain-api/incoming",
    "domain-api/model",
    "domain-api/outgoing",
    "incoming/pantsu_openapi",
    "incoming/http-api",
    "outgoing/iqdb",
    "outgoing/fs",
    "outgoing/postgres",
    "outgoing/shared/worker",
]

[workspace.dependencies]
pantsu-domain = { path = "domain" }
kani-domain-api-incoming = { path = "domain-api/incoming" }
kani-domain-api-model = { path = "domain-api/model" }
kani-domain-api-outgoing = { path = "domain-api/outgoing" }
pantsu-openapi = { path = "incoming/pantsu_openapi" }
pantsu-http-api = { path = "incoming/http-api" }
pantsu-fs = { path = "outgoing/fs" }
pantsu-iqdb = { path = "outgoing/iqdb" }
pantsu-worker = { path = "outgoing/shared/worker" }
pantsu-postgres = { path = "outgoing/postgres" }

anyhow = "1.0.102"
async-trait = "0.1.89"
axum = "0.8.7"
axum-macros = "0.5.0"
axum_typed_multipart = "0.16.4"
blockhash = "1.0.0"
byte-unit = "5.2.0"
bytes = "1.11.0"
chrono = "0.4.42"
diesel = "2.3.9"
diesel-derive-enum = "2.1.0"
diesel_migrations = "2.3.2"
figment = "0.10.19"
futures = "0.3.31"
image = "0.25.9"
lz_fnv = "0.1.2"
regex = "1.12.2"
r2d2 = "0.8.10"
serde = "1.0.228"
serde_json = "1.0.145"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
tokio-stream = "0.1.17"
tower-http = "0.6.7"
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
yansi = "1.0.1"
headers = "0.4.1"
axum-extra = "0.12.2"
#dev-dependencies
assertables = "9.9.0"
rand = "0.10.1"
serial_test = "3.4.0"

