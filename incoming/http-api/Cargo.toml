[package]
name = "pantsu-http-api"
version = "0.1.0"
edition = "2024"

[dependencies]
# TODO remove dependency when possible
pantsu-domain = { workspace = true }
kani-domain-api-incoming = { workspace = true }
kani-domain-api-model = { workspace = true }
pantsu-openapi = { workspace = true }

async-trait = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
axum-extra = { workspace = true }
chrono = { workspace = true }
headers = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true, features = ["trace", "request-id"] }
tracing = { workspace = true }

[features]
# instead of reading user from header, always mocks 'anonymous' as user_name
mock-user = []
