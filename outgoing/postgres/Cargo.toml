[package]
name = "kani-postgres"
version = "0.1.0"
edition = "2024"

[dependencies]
kani-domain-api-model = { workspace = true }
kani-domain-api-outgoing = { workspace = true }

anyhow = { workspace = true }
chrono = { workspace = true }
diesel = { workspace = true, features = ["postgres", "chrono", "r2d2"] }
diesel-derive-enum = { workspace = true, features = ["postgres"] }
diesel_migrations = { workspace = true, features = ["postgres"] }
pgvector = { workspace = true, features = ["diesel"] }
r2d2 = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
kani-domain-api-model = { workspace = true, features = ["test-util"] }

assertables = { workspace = true }
rand = { workspace = true }
serial_test = { workspace = true }

[features]
mock-user = []
